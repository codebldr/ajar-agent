# Publishes the agent as a ready-made image, so a NAS can pull it instead of building it.
#
# Building on the NAS was the hard part of every first install: no git, a tarball instead, a
# terminal most owners had never opened. Pulled from a registry, the NAS's own screens can do
# the whole thing.
#
# `main` becomes `latest`; a tag `v1.2.3` becomes `1.2.3` as well. Three architectures, because
# the machines this runs on are an x86 NAS, a 64-bit Pi, and the older 32-bit Pis and ARM boxes.

name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Docker Hub as well, because that is the one registry a NAS's own screens search: Synology's
    # Container Manager, QNAP, Unraid and Portainer all look there by default. Only once both
    # secrets exist — until then this publishes to GitHub alone rather than failing.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    # Each action pinned to a commit rather than a tag. A tag can be moved to other code by
    # whoever controls that repository, and every step here can read the Docker Hub token —
    # which can replace the image every NAS pulls. The tag each commit was is kept beside it.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            name=ghcr.io/${{ github.repository_owner }}/ajar-agent
            name=docker.io/${{ env.DOCKERHUB_USERNAME }}/ajar-agent,enable=${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
