# Builds the Synology package.
#
# On every push to main it is built and kept as a download on the run, so a test build is always
# one click away. A tag `v1.2.3` also publishes it on that tag's GitHub release, which is the page
# the Synology guide sends people to.

name: synology

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spk:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commits for the same reason as the image workflow; the tag is beside each.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Synology wants major.minor.patch-build. A tag gives the first three; the run number keeps
      # every build of the same tag newer than the last, which is what Package Center compares.
      - id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) base="${GITHUB_REF#refs/tags/v}" ;;
            *) base="0.0.0" ;;
          esac
          echo "spk=$base-$(printf '%04d' "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"

      - run: sh synology/build.sh "${{ steps.version.outputs.spk }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ajar-${{ steps.version.outputs.spk }}-noarch.spk
          path: dist/*.spk

      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Ajar agent $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/*.spk --clobber
